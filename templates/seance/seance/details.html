{% extends 'base.html'%} {% block content %}
<div class="container">
    <div class="border p-4 bg-light shadow-lg m-5 bg-white rounded">
        <div class="row">
            <div class="col-lg-7">
                <div class="px-5">
                    <h3 class="display-4 fw-bold lh-1 mb-3 text-secondary">
                        {{ seance.film.titre}}
                    </h3>

                    <br />
                    <br />
                    <td class="text-center">
                        <small>
                            <img
                                src="/media/{{ seance.film.affiche }}"
                                alt="{{ film.affiche }}"
                                style="width: 40%"
                            />
                        </small>
                    </td>
                    <br />
                    <br />
                    <p>{{seance.film.description }}</p>
                </div>
            </div>
            <div class="col-lg-4 border shadow-lg p-4 mb-5 bg-white rounded">
                <div class="pt-3">
                    <small>
                        <b>Salle</b>:<br />
                        {{seance.salle}}
                    </small>
                    <br /><br />
                    <small>
                        <b>Date</b>:<br />
                        {{seance.date}}</small
                    >
                    <br /><br />
                    <small> <b>Créneau</b>: <br />{{seance.horaire}}</small>
                    <br /><br />
                    <small>
                        <b>Date</b>:<br />
                        {{seance.place_dispo}}
                    </small>
                    <br /><br />
                    <small>
                        <b>Prix d'entrée</b>:<br />
                        {{seance.prix}} €
                    </small>
                    <br /><br />
                </div>

                <br />

                <a href="{% url 'list_film'%}" style="text-decoration: none">
                    <button
                        type="button"
                        class="btn btn btn-outline-success rounded-4"
                    >
                        Retour
                    </button>
                </a>
            </div>
        </div>
    </div>
</div>

{% endblock content%}
